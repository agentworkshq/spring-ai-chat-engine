spring:
  application:
    name: spring-ai-chat-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:chatengine}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:chat}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:chat}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    async:
      # Streamed replies are async requests; the container default (30s) can cut off long generations.
      request-timeout: 2m
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
          temperature: 0.7

chat:
  # system-prompt defaults to a concise, helpful assistant prompt (see ChatProperties)
  history-window: 20
  max-input-chars: 8000
  llm:
    connect-timeout: ${LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${LLM_READ_TIMEOUT:60s}
    # Total attempts per call (1 = no retries). Only transient failures are retried:
    # 408/409/429/5xx, timeouts and connection errors, with exponential backoff.
    max-attempts: ${LLM_MAX_ATTEMPTS:3}

logging:
  pattern:
    # Adds the request id (set by RequestIdFilter) to every log line.
    level: "%5p [%X{requestId:-}]"
  level:
    # On a failed stream this logger prints the raw provider error message and stack traces, which
    # must never be logged. ChatService logs the failure once, from safe fields only.
    org.springframework.ai.chat.model.MessageAggregator: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health,info
